<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>JEKETI RHYTHM</title>
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f5a40">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="version.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #16261c; overflow: hidden; }
  #g { position: absolute; left: 0; top: 0; border: 0; width: 100%; height: 100%; transform-origin: 0 0; background: #000; }
  #dbg { position: fixed; left: 4px; bottom: 4px; z-index: 9; font: 12px monospace; color: #0f0; background: rgba(0,0,0,.7); padding: 2px 6px; pointer-events: none; }
</style>
</head>
<body>
<script>
(function () {
  // Ask the server for the newest version number, skipping every browser cache.
  // If that fails (offline or very slow), use the one loaded by <script src="version.js">.
  function getVersion(done) {
    var finished = false;
    var timer = setTimeout(function () { finish(); }, 3000);
    function finish(v) {
      if (finished) return;
      finished = true;
      clearTimeout(timer);
      if (v) window.GAME_VERSION = v;
      done(window.GAME_VERSION || 0);
    }
    if (location.protocol === 'file:' || !window.fetch) { finish(); return; }
    fetch('version.js?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.text() : ''; })
      .then(function (text) {
        var m = /GAME_VERSION\s*=\s*(\d+)/.exec(text);
        finish(m && Number(m[1]));
      })
      .catch(function () { finish(); });
  }

  getVersion(start);

  function start(version) {
    var coarse = matchMedia('(pointer: coarse)').matches;
    if (!coarse) {
      var q = location.search.replace(/([?&])v=[^&]*&?/g, '$1').replace(/[?&]$/, '');
      location.replace('game.html' + q + (q ? '&' : '?') + 'v=' + version + location.hash);
      return;
    }

    if ('serviceWorker' in navigator && location.protocol !== 'file:' && !/[?&]nosw/.test(location.search)) {
      var registerSW = function () {
        navigator.serviceWorker.register('sw.js?v=' + version, { updateViaCache: 'none' }).catch(function () {});
      };
      if (document.readyState === 'complete') registerSW();
      else addEventListener('load', registerSW);
    }

    var VW = 1536, VH = 776;
    var debug = /[?&]debug/.test(location.search);
    var f = document.createElement('iframe');
    f.id = 'g';
    f.setAttribute('allow', 'autoplay; fullscreen; screen-wake-lock');
    f.setAttribute('allowfullscreen', '');
    f.src = 'game.html?v=' + Date.now() + location.search.replace('?','&') + location.hash;
    document.body.appendChild(f);
    var dbg;
    if (debug) { dbg = document.createElement('div'); dbg.id = 'dbg'; document.body.appendChild(dbg); }

    var playing = false;
    var PW = 1000;
    var lastKey = '';
    function fit() {
      var w = window.innerWidth, h = window.innerHeight;
      var key = w + 'x' + h + (playing ? 'P' : 'M');
      if (key === lastKey) return;
      lastKey = key;
      if (w > h && playing) {
        f.style.width = '100%'; f.style.height = '100%'; f.style.transform = 'none';
      } else if (w > h && (w < VW || h < VH)) {
        var s = Math.min(w / VW, h / VH);
        f.style.width = VW + 'px';
        f.style.height = VH + 'px';
        f.style.transform = 'translate(' + ((w - VW * s) / 2) + 'px,' + ((h - VH * s) / 2) + 'px) scale(' + s + ')';
      } else {
        f.style.width = '100%'; f.style.height = '100%'; f.style.transform = 'none';
      }
      if (dbg) dbg.textContent = (playing ? 'PLAY ' : 'MENU ') + w + 'x' + h + '  frame ' + f.style.width + ' x ' + f.style.height + '  dpr ' + devicePixelRatio;
    }
    fit();
    function refit() { fit(); [100, 300, 700, 1500].forEach(function (t) { setTimeout(fit, t); }); }
    addEventListener('resize', refit);
    addEventListener('orientationchange', refit);
    document.addEventListener('fullscreenchange', refit);
    document.addEventListener('webkitfullscreenchange', refit);
    if (window.visualViewport) visualViewport.addEventListener('resize', refit);
    if (screen.orientation && screen.orientation.addEventListener) screen.orientation.addEventListener('change', refit);
    setInterval(fit, 600);

    addEventListener('message', function (e) {
      if (e.data && e.data.jeketi === 'play') { playing = !!e.data.on; fit(); return; }
      if (!e.data || e.data.jeketi !== 'fullscreen') return;
      var el = document.documentElement;
      try {
        var p = el.requestFullscreen ? el.requestFullscreen() : (el.webkitRequestFullscreen && el.webkitRequestFullscreen());
        if (p && p.catch) p.catch(function () {});
      } catch (err) {}
    });
  } // end of start()
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=game.html"></noscript>
</body>
</html>
